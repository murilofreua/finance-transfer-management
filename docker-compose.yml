services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finance-sql-server
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - finance-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${MSSQL_SA_PASSWORD}
        - -C
        - -Q
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Finance.Api/Dockerfile
    container_name: finance-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=FinanceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "5007:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./finance-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5007
    container_name: finance-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  finance-sql-data:
